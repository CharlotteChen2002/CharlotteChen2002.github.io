name: Lint Markdown

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            _posts/**/*.md
            _pages/**/*.md
            _portfolio/**/*.md
            _teaching/**/*.md
            _publications/**/*.md
            _talks/**/*.md
            *.md
