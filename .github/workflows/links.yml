name: Check Links

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.4"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check internal links with HTMLProofer
        run: |
          gem install html-proofer --no-document
          htmlproofer _site \
            --disable-external \
            --checks links,scripts \
            --allow-missing-href \
            --ignore-files "_site/feed.xml" \
            --ignore-urls "/^#/" \
            --no-enforce-https
